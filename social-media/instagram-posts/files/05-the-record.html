<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artifact Grafx — The Record (9:16 Reel)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1f1b17;
      --bg-mid: #2a251f;
      --bg-deep: #17130f;
      --gold: #d9a95b;
      --gold-soft: #e3b467;
      --cream: #ece5dd;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #0d0b09;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .reel {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 55% at 50% 44%, var(--bg-mid) 0%, var(--bg) 62%, var(--bg-deep) 100%);
      isolation: isolate;
    }

    /* ---------- outro veil: fades content back to bare background for a clean loop ---------- */
    .veil {
      position: absolute;
      inset: 0;
      z-index: 5;
      background:
        radial-gradient(ellipse 70% 55% at 50% 44%, var(--bg-mid) 0%, var(--bg) 62%, var(--bg-deep) 100%);
      opacity: 0;
      animation: veil 7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* veil carries its own copy of the grid so the fade lands on the exact opening frame */
    .veil::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(236, 229, 221, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(236, 229, 221, 0.045) 1px, transparent 1px);
      background-size: 36px 36px;
      -webkit-mask-image: radial-gradient(ellipse 78% 62% at 50% 46%, #000 0%, transparent 82%);
      mask-image: radial-gradient(ellipse 78% 62% at 50% 46%, #000 0%, transparent 82%);
    }

    /* ---------- survey grid ---------- */
    .grid {
      position: absolute;
      inset: 0;
      z-index: 2;
      background-image:
        linear-gradient(rgba(236, 229, 221, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(236, 229, 221, 0.045) 1px, transparent 1px);
      background-size: 36px 36px;
      -webkit-mask-image: radial-gradient(ellipse 78% 62% at 50% 46%, #000 0%, transparent 82%);
      mask-image: radial-gradient(ellipse 78% 62% at 50% 46%, #000 0%, transparent 82%);
    }

    /* ---------- ignition glow ---------- */
    .glow {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 1040px;
      height: 1040px;
      z-index: 3;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle,
        rgba(217, 169, 91, 0.17) 0%,
        rgba(217, 169, 91, 0.06) 40%,
        rgba(217, 169, 91, 0) 68%);
      mix-blend-mode: screen;
      opacity: 0;
      animation: ignite 7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* ---------- embers ---------- */
    .embers {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
    }

    .embers i {
      position: absolute;
      display: block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px rgba(217, 169, 91, 0.6);
      opacity: 0;
      animation-name: rise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    /* ---------- stage ---------- */
    .stage {
      position: absolute;
      inset: 0;
      z-index: 4;
      animation: drift 7s linear forwards;
    }

    .marker {
      position: absolute;
      top: 182px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
      opacity: 0;
      animation: riseIn 0.9s var(--ease) 0.15s forwards;
    }

    .marker .rule {
      width: 62px;
      height: 1px;
      background: rgba(217, 169, 91, 0.42);
      display: block;
    }

    .marker .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 21px;
      line-height: 1;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(217, 169, 91, 0.66);
      white-space: nowrap;
    }

    .quote {
      position: absolute;
      left: 50%;
      top: 47%;
      width: 980px;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .quote-mark {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 180px;
      line-height: 0.8;
      color: var(--gold);
      margin-bottom: 38px;
      opacity: 0;
      animation: riseIn 0.9s var(--ease) 0.5s forwards;
    }

    .quote-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 78px;
      font-weight: 600;
      line-height: 1.36;
      letter-spacing: -0.018em;
      color: var(--cream);
    }

    .quote-text .line {
      display: block;
      opacity: 0;
      animation: riseIn 0.95s var(--ease) forwards;
    }

    .quote-text .line:nth-child(1) { animation-delay: 0.9s; }
    .quote-text .line:nth-child(2) { animation-delay: 1.04s; }
    .quote-text .line:nth-child(3) { animation-delay: 1.18s; }
    .quote-text .line:nth-child(4) { animation-delay: 1.32s; }

    .quote-text .line:nth-child(5) { animation-delay: 1.46s; }
    .quote-text .line:nth-child(6) { animation-delay: 1.60s; }

    .accent {
      background: linear-gradient(100deg,
        #c1903f 0%,
        #f2cd8e 30%,
        #d9a95b 55%,
        #ffe2b0 78%,
        #c1903f 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 0 30px rgba(217, 169, 91, 0.4));
      animation: emberShift 5.5s ease-in-out infinite;
    }

    /* ---------- brand lockup: emblem + handle share one centered axis ---------- */
    .brand {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 248px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .emblem {
      width: 76px;
      height: 104px;
      display: block;
      color: var(--gold);
      opacity: 0;
      animation: riseIn 0.95s var(--ease) 2.15s forwards;
    }

    .handle {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      line-height: 1;
      letter-spacing: 0.24em;
      text-align: center;
      white-space: nowrap;
      color: rgba(217, 169, 91, 0.72);
      opacity: 0;
      animation: riseIn 0.95s var(--ease) 2.35s forwards;
    }

    /* ---------- keyframes ---------- */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(34px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes drift {
      0%   { transform: scale(1); }
      100% { transform: scale(1.014); }
    }

    @keyframes ignite {
      0%, 18%   { opacity: 0; }
      38%       { opacity: 1; }
      58%       { opacity: 0.72; }
      76%       { opacity: 0.95; }
      100%      { opacity: 0.82; }
    }

    @keyframes veil {
      0%, 92% { opacity: 0; }
      100%    { opacity: 1; }
    }

    @keyframes emberShift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    @keyframes rise {
      0%   { opacity: 0;    transform: translateY(0) scale(0.7); }
      14%  { opacity: 0.30; }
      62%  { opacity: 0.16; }
      100% { opacity: 0;    transform: translateY(-330px) scale(1.1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .veil, .glow, .embers { display: none; }
      .stage { animation: none; }
      .marker, .quote-mark, .quote-text .line, .emblem, .handle {
        animation: none;
        opacity: 1;
      }
      .accent { animation: none; }
    }
  </style>
</head>
<body>
  <main class="reel">
    <div class="veil"></div>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="embers">
      <i style="left: 7%;  top: 92%; animation-delay: -0.4s;  animation-duration: 12s;"></i>
      <i style="left: 16%; top: 84%; animation-delay: -3.1s;  animation-duration: 14s;"></i>
      <i style="left: 24%; top: 96%; animation-delay: -6.2s;  animation-duration: 11s;"></i>
      <i style="left: 31%; top: 78%; animation-delay: -9.4s;  animation-duration: 15s;"></i>
      <i style="left: 39%; top: 90%; animation-delay: -2.2s;  animation-duration: 13s;"></i>
      <i style="left: 47%; top: 82%; animation-delay: -7.8s;  animation-duration: 16s;"></i>
      <i style="left: 54%; top: 94%; animation-delay: -4.6s;  animation-duration: 12s;"></i>
      <i style="left: 61%; top: 80%; animation-delay: -10.5s; animation-duration: 14s;"></i>
      <i style="left: 68%; top: 91%; animation-delay: -1.7s;  animation-duration: 13s;"></i>
      <i style="left: 74%; top: 76%; animation-delay: -5.9s;  animation-duration: 15s;"></i>
      <i style="left: 82%; top: 88%; animation-delay: -8.3s;  animation-duration: 12s;"></i>
      <i style="left: 89%; top: 95%; animation-delay: -3.8s;  animation-duration: 16s;"></i>
      <i style="left: 94%; top: 81%; animation-delay: -11.2s; animation-duration: 14s;"></i>
    </div>

    <div class="stage">
      <header class="marker">
        <span class="rule"></span>
        <span class="label">005 &mdash; The Record</span>
        <span class="rule"></span>
      </header>

      <div class="quote">
        <div class="quote-mark">&ldquo;</div>
        <p class="quote-text">
          <span class="line">Some ideas start</span>
          <span class="line">with a pencil.</span>
          <span class="line">Mine start with</span>
          <span class="line">the <span class="accent">needle drop</span>.</span>
        </p>
      </div>

      <footer class="brand">
        <svg class="emblem" viewBox="0 0 64 88" aria-label="Artifact Grafx emblem">
          <path d="M22 8 42 18M42 8 22 18M32 23 59 55 32 87 5 55Z" fill="none" stroke="currentColor" stroke-width="2" />
          <text x="32" y="64" text-anchor="middle" fill="currentColor" font-family="Space Grotesk" font-size="30">A</text>
        </svg>
        <div class="handle">@artifactgrafx</div>
      </footer>
    </div>
  </main>
</body>
</html>
